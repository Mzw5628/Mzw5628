name: Daily Empty Commit & Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 0点 (北京时间早上8点) 自动执行
  workflow_dispatch:      # 允许手动点击触发测试
  push:
    branches:
      - main

jobs:
  # 任务1：每天在 main 分支打一个空卡（刷绿格子，不产生任何文件）
  # 注意：空提交不会被 GitHub 计入贡献图，所以下面已改为向 activity.log 追加真实内容
  daily-commit:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Git
        run: |
          git config --global user.name "Mzw5628"
          git config --global user.email "weiz1059@gmail.com"

      - name: Make a real commit and push
        run: |
          # 向 activity.log 追加当前时间，产生实际变更
          echo "Daily activity: $(date -u +'%Y-%m-%d %H:%M:%S UTC') run=${{ github.run_id }}" >> activity.log
          git add activity.log
          git commit -m "chore: daily activity $(date -u +'%Y-%m-%d')"
          git push origin main

  # 任务2：生成贪吃蛇动画
  # needs: daily-commit 表示等上面的提交完成后，再生成贪吃蛇，这样能捕捉到最新的格子
  generate-snake:
    needs: daily-commit
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Daily Empty Commit & Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 0点 (北京时间早上8点) 自动执行
  workflow_dispatch:      # 允许手动点击触发测试
  push:
    branches:
      - main

jobs:
  # 任务1：每天在 main 分支打一个空卡（刷绿格子，不产生任何文件）
  empty-commit:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Make an empty commit and push
        run: |
          # 拉取最新代码防止冲突
          git pull origin main --rebase
          # 核心：允许空提交
          git commit --allow-empty -m "chore: daily empty commit $(date +'%Y-%m-%d')"
          git push

  # 任务2：生成贪吃蛇动画
  # needs: empty-commit 表示等上面的空提交完成后，再生成贪吃蛇，这样能捕捉到最新的格子
  generate-snake:
    needs: empty-commit
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}